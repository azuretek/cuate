# SwiftLint, for the iOS shell.
#
# core and desktop get the ESLint import rules for the class of fault that only
# shows up when a module links. ios is Swift, where a typed compile already
# catches that class: the compiler refuses a call to a member that does not
# exist and a type that does not match. So SwiftLint here is not a second type
# checker, it is the STYLE and consistency layer the compiler does not provide.
#
# A linter that is red on day one is a linter everyone learns to ignore, so the
# rules that conflict with this tree's own conventions are turned off here, each
# with its reason, and everything else in SwiftLint's default set stays on. CI
# runs with --strict, so any warning is a failure.

excluded:
  - build
  - .build
  - Cuate.xcodeproj
  - scripts

disabled_rules:
  # The codebase uses trailing commas in collection literals on purpose.
  - trailing_comma
  # A matter of taste, and this tree's taste is established.
  - line_length
  # Short bindings in tests and short names in small scopes read better here.
  - identifier_name
  # Types nested inside view builders where the nesting is the point.
  - nesting
  # File, function, type and cycle lengths are budgets, not correctness. A
  # SwiftUI view body is long because it draws a screen.
  - file_length
  - function_body_length
  - type_body_length
  - cyclomatic_complexity
  # Left to Xcode's own formatter.
  - vertical_whitespace
  - trailing_newline
  - statement_position
  # A matrix of small value types reads better as a tuple at the point of use.
  - large_tuple
  # The explicit if inside a for is this codebase's readable form.
  - for_where
  # Short type names in tests are clear in a file where nothing else shares them.
  - type_name
