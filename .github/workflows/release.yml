name: desktop test release
on:
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: desktop-test-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.changes.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: changes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/release/changes.mjs
      - id: version
        run: node scripts/release/version.mjs
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  build:
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/package.yml
    with:
      signed: true
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
  release:
    needs:
      - prepare
      - build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      - run: node scripts/release/collect.mjs artifacts release-assets
      - name: Verify all assets, draft, attach, verify remote digests, publish, retain ten
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/release.mjs release-assets "$VERSION" "$GITHUB_SHA" --apply
