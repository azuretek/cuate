name: test release

# ★ The trigger and concurrency conditions, set against the sibling app's release
# path this workflow is copied from. Two differences are deliberate and named
# here rather than left for a diff to find later:
#
#   * There is no tag (v*) trigger, and none is wanted. This workflow publishes
#     only test builds; a stable release selects an exact snapshot through a
#     separately designed process (docs/release.md). The sibling's tag path
#     exists because it publishes stable releases, so the version job's
#     tag-equals-package.json check has nothing to check here.
#   * cancel-in-progress stays false. The sibling cancels an in-progress branch
#     build when a newer push arrives; this workflow must never cancel a
#     publishing run, because a cancelled run can leave a draft behind. A newer
#     push queues behind the publishing run instead.
on:
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
  # The platforms gate reads the other pipelines' runs and jobs, and a reusable
  # workflow can only be granted what its caller has. Nothing here writes.
  actions: read
concurrency:
  group: desktop-test-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.changes.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: changes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/release/changes.mjs
      - id: version
        run: node scripts/release/version.mjs
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  # The platforms gate. A test build publishes only once every pipeline that
  # builds a platform on this commit has, as a whole, concluded success, and the
  # iOS half is the archive, the TestFlight upload, its wait for the build to
  # reach VALID and its proof that the build reached the tester group, so a
  # desktop-only test build can no longer go out ahead of the
  # phone. The pipelines are named here, and desktop/test/gate.test.js fails when
  # a workflow that builds a platform is not named by a gate call, so a new
  # platform joins the gate by failing a test rather than by publishing silently.
  # Named platforms, not gate: ci.yml owns the one job called gate, and a second
  # one would mean two answers to what the required gate is. desktop/test/release-policy.test.js
  # fails when the release path grows its own.
  platforms:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/platforms-gate.yml
    with:
      platforms: ci, ios, android
      purpose: publish
      sha: ${{ github.sha }}
      ref_name: ${{ github.ref_name }}
      window: 150

  build:
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/package.yml
    with:
      signed: true
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
  # The server artifact, from the same commit and the same prepared version as the desktop packages. It runs the
  # server's own tests first, and the publisher needs it, so a server that fails its tests holds the whole release.
  server:
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/server-artifact.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
  release:
    needs:
      - prepare
      - platforms
      - build
      - server
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' && needs.platforms.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Reads the android pipeline's release artifact for this commit (issue 192); nothing here writes to Actions.
      actions: read
      # Reads the merged pull requests the release body is generated from.
      pull-requests: read
    steps:
      # Full history and tags: the notes are the pull requests merged since the previous
      # release tag, which is found with git tag --merged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A network step, so it carries its own deadline rather than the job's (issue 66).
      - run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      - run: node scripts/release/collect.mjs artifacts release-assets
      - uses: actions/download-artifact@v4
        with:
          name: server-release
          path: release-assets
      # The signed APK and its manifest, from the android run the platforms gate already required to succeed, so a
      # phone can update itself from the release (issue 192). A network step, so it carries its own deadline.
      - name: Fetch the signed APK for this commit
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/android-artifact.mjs fetch "$GITHUB_SHA" release-assets
      # The body is generated from the merged pull requests since the previous tag, never
      # from raw commits, so the version stays single-sourced in version.mjs and every
      # release reads the same way.
      - name: Generate the release notes from the merged pull requests
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/changelog.mjs --tag "v$VERSION" --out release-notes.md
      - name: Verify all assets, draft, attach, verify remote digests, publish, retain ten
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/release.mjs release-assets "$VERSION" "$GITHUB_SHA" --notes-file release-notes.md --apply
