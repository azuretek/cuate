name: test release

# ★ The trigger and concurrency conditions, set against the sibling app's release
# path this workflow is copied from. Two differences are deliberate and named
# here rather than left for a diff to find later:
#
#   * The tag path (vX.Y.Z) is the RELEASE lane, folded in from the sibling
#     (chela) at issue #279. A stable release is cut only by a vX.Y.Z tag, never
#     automatically; the tag is produced by release-please (release-please.yml)
#     with draft and force-tag-creation, and this workflow is started for it with
#     workflow_dispatch (a tag pushed with GITHUB_TOKEN raises no workflow event).
#     The dev lane below is unchanged: it publishes a snapshot per shipping push.
#   * cancel-in-progress stays false. The sibling cancels an in-progress branch
#     build when a newer push arrives; this workflow must never cancel a
#     publishing run, because a cancelled run can leave a draft behind. A newer
#     push queues behind the publishing run instead.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: null
permissions:
  contents: read
  # The platforms gate reads the other pipelines' runs and jobs, and a reusable
  # workflow can only be granted what its caller has. Nothing here writes.
  actions: read
concurrency:
  group: desktop-test-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.pick.outputs.release }}
      version: ${{ steps.pick.outputs.version }}
      tagged: ${{ steps.pick.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The dev lane (a main push or a manual dispatch): which paths ship, and the
      # X.Y.Z-dev.<count>.<sha> snapshot of this commit.
      - id: changes
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/release/changes.mjs
      - id: version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/release/version.mjs
      # The release lane (a vX.Y.Z tag): the tag IS the version, and it must agree
      # with every file that owns one, refused loudly before anything is built.
      - id: stable
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/release/version.mjs --check-files "$GITHUB_REF"
      - id: pick
        env:
          DEV_VERSION: ${{ steps.version.outputs.version }}
          DEV_RELEASE: ${{ steps.changes.outputs.release }}
          STABLE_VERSION: ${{ steps.stable.outputs.version }}
        run: |
          set -eo pipefail
          if [ -n "$STABLE_VERSION" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "version=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "release=$DEV_RELEASE" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          fi
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  # The platforms gate. A test build publishes only once every pipeline that
  # builds a platform on this commit has, as a whole, concluded success, and the
  # iOS half is the archive, the TestFlight upload, its wait for the build to
  # reach VALID and its proof that the build reached the tester group, so a
  # desktop-only test build can no longer go out ahead of the
  # phone. The pipelines are named here, and desktop/test/gate.test.js fails when
  # a workflow that builds a platform is not named by a gate call, so a new
  # platform joins the gate by failing a test rather than by publishing silently.
  # Named platforms, not gate: ci.yml owns the one job called gate, and a second
  # one would mean two answers to what the required gate is. desktop/test/release-policy.test.js
  # fails when the release path grows its own. Exactly one gate call carries
  # purpose publish, on the dev lane and the release lane alike.
  platforms:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/platforms-gate.yml
    with:
      platforms: ci, ios, android
      purpose: publish
      sha: ${{ github.sha }}
      ref_name: ${{ github.ref_name }}
      window: 150

  build:
    needs: prepare
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/package.yml
    with:
      signed: true
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
  # The server artifact, from the same commit and the same prepared version as the desktop packages. It runs the
  # server's own tests first, and the publisher needs it, so a server that fails its tests holds the whole release.
  server:
    needs: prepare
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' }}
    uses: ./.github/workflows/server-artifact.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
  release:
    needs:
      - prepare
      - platforms
      - build
      - server
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.release == 'true' && needs.platforms.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Reads the android pipeline's release artifact for this commit (issue 192); nothing here writes to Actions.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A network step, so it carries its own deadline rather than the job's (issue 66).
      - run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      - run: node scripts/release/collect.mjs artifacts release-assets
      - uses: actions/download-artifact@v4
        with:
          name: server-release
          path: release-assets
      # The signed APK and its manifest, from the android run the platforms gate already required to succeed, so a
      # phone can update itself from the release (issue 192). A network step, so it carries its own deadline.
      - name: Fetch the signed APK for this commit
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/android-artifact.mjs fetch "$GITHUB_SHA" release-assets
      - name: Verify all assets, draft, attach, verify remote digests, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/release.mjs release-assets "$VERSION" "$GITHUB_SHA" --apply

