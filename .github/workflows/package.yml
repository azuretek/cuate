name: desktop packaging
on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
      version:
        type: string
        required: true
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
permissions:
  contents: read
jobs:
  verify-assets:
    name: desktop asset completeness
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      - run: node scripts/release/collect.mjs artifacts release-assets
      - env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/assets.mjs release-assets "$VERSION"
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      BUILD_VERSION: ${{ inputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Refuse untrusted signing request
        if: ${{ inputs.signed && !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: packaging-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm --filter desktop icons
      - name: Package signed macOS application
        if: runner.os == 'macOS' && inputs.signed && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node desktop/scripts/package-mac.mjs ${{ matrix.arch }}
      - name: Package unsigned macOS verification build
        if: runner.os == 'macOS' && !inputs.signed
        run: pnpm --filter desktop package --mac --${{ matrix.arch }} --config.mac.identity=null --config.mac.notarize=false --config.dmg.sign=false
      - name: Package Linux or Windows
        if: runner.os != 'macOS'
        run: pnpm --filter desktop package --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Packaged Linux boot smoke
        if: runner.os == 'Linux'
        env:
          SHOTS: ${{ runner.temp }}/packaged-smoke
          SMOKE_SOFTWARE_RENDERING: "1"
        run: xvfb-run -a node desktop/scripts/smoke-packed.mjs
      - name: Packaged Windows and macOS boot smoke
        if: runner.os != 'Linux'
        env:
          SHOTS: ${{ runner.temp }}/packaged-smoke
        run: node desktop/scripts/smoke-packed.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/dev*.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/packaged-smoke/*.png
            ${{ runner.temp }}/packaged-smoke/report.json
