name: desktop packaging
on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
      version:
        type: string
        required: true
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
permissions:
  contents: read
jobs:
  verify-assets:
    name: desktop asset completeness
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A network step, so it carries its own deadline rather than the job's (issue 66).
      - run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
      - run: node scripts/release/collect.mjs artifacts release-assets
      - env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/assets.mjs release-assets "$VERSION" --desktop
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    # The build leg reached forty-four minutes once (run 36888349385) before the job cancelled it; the
    # packaging download, the packaged smoke and the virtual display all sit inside it here. Sixty minutes
    # leaves room for a congested queue without dropping the bound.
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ inputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Refuse untrusted signing request
        if: ${{ inputs.signed && !((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The Electron and electron-builder downloads are the packaging leg's network reach, so they are cached, and
      # whether the cache answered is STATED in the log rather than assumed (issue 66): the step below names hit,
      # partial (an older lockfile's key) or miss, and counts what the restored folder holds, and the step after
      # packaging counts it again, so a miss that had to download is visible as the difference.
      - name: Cache the packaging downloads
        id: packaging-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/packaging-cache
          key: packaging-v2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            packaging-v2-${{ runner.os }}-${{ matrix.arch }}-
      - name: Set packaging cache outside application module scope
        shell: bash
        env:
          PACKAGING_CACHE: ${{ runner.temp }}/packaging-cache
          CACHE_HIT: ${{ steps.packaging-cache.outputs.cache-hit }}
        run: |
          echo "ELECTRON_CACHE=$PACKAGING_CACHE/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$PACKAGING_CACHE/electron-builder" >> "$GITHUB_ENV"
          bash scripts/ci/state-cache.sh "packaging download cache" "$CACHE_HIT" "$PACKAGING_CACHE"
      # A network step (the package store and Electron's own postinstall download), so it has its own deadline.
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 8
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm --filter desktop icons
      - name: Package signed macOS application
        if: runner.os == 'macOS' && inputs.signed && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node desktop/scripts/package-mac.mjs ${{ matrix.arch }}
      - name: Package unsigned macOS verification build
        if: runner.os == 'macOS' && !inputs.signed
        timeout-minutes: 15
        run: pnpm --filter desktop package --mac --${{ matrix.arch }} --config.mac.identity=null --config.mac.notarize=false --config.dmg.sign=false
      - name: Package Linux or Windows
        if: runner.os != 'macOS'
        timeout-minutes: 15
        run: pnpm --filter desktop package --${{ matrix.platform }} --${{ matrix.arch }}
      # The step that flaked, measured on run 36888349385: an unbounded apt-get
      # held this leg for forty-four minutes until the job's own timeout cancelled
      # it. Package setup now goes through one bounded script, so a stalled mirror
      # fails the step in minutes and the leg is never the thing that hangs.
      - name: Virtual display
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          bash scripts/ci/install-display-packages.sh xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: State what packaging took from the cache
        shell: bash
        env:
          CACHE_HIT: ${{ steps.packaging-cache.outputs.cache-hit }}
        run: bash scripts/ci/state-cache.sh "packaging download cache after packaging" "$CACHE_HIT" "${{ runner.temp }}/packaging-cache"
      # The smoke bounds its own app (SMOKE_TIMEOUT_MS, ten minutes, issue 267) and smoke-packed.mjs sits above
      # that; this step deadline sits above smoke-packed, so a slow packaged smoke is stopped by the bound that
      # can say what it measured, never by a bare step timeout.
      - name: Packaged Linux boot smoke
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          SHOTS: ${{ runner.temp }}/packaged-smoke
          SMOKE_SOFTWARE_RENDERING: "1"
        run: xvfb-run -a node desktop/scripts/smoke-packed.mjs
      - name: Packaged Windows and macOS boot smoke
        if: runner.os != 'Linux'
        timeout-minutes: 15
        env:
          SHOTS: ${{ runner.temp }}/packaged-smoke
        run: node desktop/scripts/smoke-packed.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          # ★ The artifact-versus-release retention split, copied from the sibling
          # app's release path. These artifacts exist only to carry the installers
          # from the six build runners to the release job: the GitHub Release is
          # the durable copy, and the prune there keeps the newest ten. GitHub's
          # repository default is 90 days (measured 2026-10-01), so the split is
          # stated here rather than left to the default, and artifacts expire as
          # fast as GitHub allows (age-only: GitHub offers no count-based limit for
          # artifacts, unlike the releases).
          retention-days: 1
          # Stored, not compressed. Every payload here is an installer or an
          # updater archive, so the bytes are already compressed and the default
          # deflate pass only spends CPU on the runner and again in the release
          # job's download for a file that cannot shrink. Copied from the sibling.
          compression-level: 0
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.blockmap
            desktop/dist/dev*.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/packaged-smoke/*.png
            ${{ runner.temp }}/packaged-smoke/report.json
            ${{ runner.temp }}/packaged-smoke/failure.json
