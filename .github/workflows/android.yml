name: android

# The Android shell's pipeline. A pull request builds the app, boots it in an
# emulator, captures the proof the phase asks for and runs the instrumented
# tests. A push to main (or a manual run) additionally signs and publishes an
# APK.
#
# Adapted from the sibling app's mobile pipeline and this repository's ios.yml
# rather than extracted from either: the framework is still being built and the
# drift between the copies is deliberate.
#
# CI runs the emulator on a standard GitHub Linux runner, which carries the
# virtualization the emulator needs. The fleet's own emulator runs live on the
# Windows host that carries Android, never on the gateway host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The compile-and-boot half. Credential-free by design: nothing here needs the
  # signing keystore, which is what keeps it runnable on a pull request.
  build-and-boot:
    name: build and boot (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs the KVM device the runner exposes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The acceptance the phase is judged by: a shell that only compiles is not
      # a shell that runs. One emulator boot serves both the capture and the
      # instrumented tests.
      - name: Boot the app, capture the proof and run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          script: |
            bash scripts/boot-proof.sh
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Keep the boot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot-proof
          path: android/proof
          if-no-files-found: warn

  # The publish half: the APK, signed with the Android release keystore.
  #
  # A pull request ships nothing, so this job does not run there; a push to main
  # or a manual run does, and it is the one path that needs the keystore. Until it
  # is set it fails loudly, naming what is missing, rather than publishing
  # nothing in silence.
  release:
    name: sign and publish the APK
    needs: [build-and-boot]
    if: github.event_name != 'pull_request' && needs.build-and-boot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the Android signing keystore is not configured. Set these repository secrets:$missing"
            exit 1
          fi
          key="$RUNNER_TEMP/cuate-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          {
            echo "CUATE_ANDROID_KEYSTORE=$key"
            echo "CUATE_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CUATE_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "CUATE_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Decide the version
        id: version
        run: |
          set -eo pipefail
          # The one owner of the base and of both derivations, so the APK cannot
          # name itself something the desktop and iOS builds do not.
          node ../scripts/release/version.mjs > /dev/null
          echo "the release APK names itself $(node ../scripts/release/version.mjs)"

      - name: Build the signed APK
        run: |
          set -eo pipefail
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.count }}"

      # A release APK whose signing is assumed is not a verified APK. This reads the
      # signer certificate back out of the file and fails the job when it is not
      # the one the keystore holds, so green means signed by the release identity
      # rather than merely produced.
      - name: Verify the signature
        run: |
          set -eo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK build-tools"
            exit 1
          fi
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          digest() { printf '%s' "$1" | tr -d ':' | tr 'A-Z' 'a-z'; }
          from_apk="$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/apk-signature.txt" | head -1 | awk '{print $NF}')"
          from_store="$(keytool -list -v -keystore "$CUATE_ANDROID_KEYSTORE" -storepass "$CUATE_ANDROID_KEYSTORE_PASSWORD" -alias "$CUATE_ANDROID_KEY_ALIAS" | grep -i 'SHA256:' | head -1 | awk '{print $2}')"
          if [ -z "$from_apk" ] || [ -z "$from_store" ]; then
            echo "::error::could not read the signing certificate from the APK or from the keystore"
            exit 1
          fi
          if [ "$(digest "$from_apk")" != "$(digest "$from_store")" ]; then
            echo "::error::the APK is signed by a different certificate than the keystore holds: APK $from_apk, keystore $from_store"
            exit 1
          fi
          echo "the APK is signed by the keystore certificate $from_store"

      - name: Keep the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
