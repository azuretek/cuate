name: android

# The Android shell's pipeline. A pull request builds the app, boots it in an
# emulator, captures the proof the phase asks for and runs the instrumented
# tests. A push to main (or a manual run) additionally signs and publishes an
# APK.
#
# Adapted from the sibling app's mobile pipeline and this repository's ios.yml
# rather than extracted from either: the framework is still being built and the
# drift between the copies is deliberate.
#
# CI runs the emulator on a standard GitHub Linux runner, which carries the
# virtualization the emulator needs. The fleet's own emulator runs live on the
# Windows host that carries Android, never on the gateway host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The compile-and-boot half. Credential-free by design: nothing here needs the
  # signing keystore, which is what keeps it runnable on a pull request.
  build-and-boot:
    name: build and boot (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs the KVM device the runner exposes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The acceptance the phase is judged by: a shell that only compiles is not
      # a shell that runs. One emulator boot serves both the capture and the
      # instrumented tests.
      - name: Boot the app, capture the proof and run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          script: |
            bash scripts/boot-proof.sh
            ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Keep the boot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot-proof
          path: android/proof
          if-no-files-found: warn

  # The publish half: the APK, signed with the Android release keystore.
  #
  # A pull request ships nothing, so this job does not run there; a push to main
  # or a manual run does, and it is the one path that needs the keystore. Until it
  # is set it fails loudly, naming what is missing, rather than publishing
  # nothing in silence.
  release:
    name: sign and publish the APK
    needs: [build-and-boot]
    if: github.event_name != 'pull_request' && needs.build-and-boot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the Android signing keystore is not configured. Set these repository secrets:$missing"
            exit 1
          fi
          key="$RUNNER_TEMP/cuate-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          {
            echo "CUATE_ANDROID_KEYSTORE=$key"
            echo "CUATE_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CUATE_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "CUATE_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Decide the version
        id: version
        run: |
          set -eo pipefail
          count="$(git rev-list --count HEAD)"
          marketing="$(node -p "require('../package.json').version")"
          version="$marketing-dev.$count.$(git rev-parse --short=10 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the release APK names itself $version"

      - name: Build the signed APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Keep the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
