name: android

# The Android shell's pipeline. A pull request builds the app, boots it in an
# emulator, captures the proof the phase asks for and runs the instrumented
# tests. A push to main (or a manual run) additionally signs and publishes an
# APK.
#
# Adapted from the sibling app's mobile pipeline and this repository's ios.yml
# rather than extracted from either: the framework is still being built and the
# drift between the copies is deliberate.
#
# CI runs the emulator on a standard GitHub Linux runner, which carries the
# virtualization the emulator needs. The fleet's own emulator runs live on the
# Windows host that carries Android, never on the gateway host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The compile-and-boot half. Credential-free by design: nothing here needs the
  # signing keystore, which is what keeps it runnable on a pull request.
  build-and-boot:
    name: build and boot (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The checks between a downloaded update and the installer (issue 192), on the JVM with no device.
      - name: Unit tests
        timeout-minutes: 15
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The emulator needs the KVM device the runner exposes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The acceptance the phase is judged by: a shell that only compiles is not
      # a shell that runs. One emulator boot serves both the capture and the
      # instrumented tests.
      # The runner action fetches the system image and the emulator before it boots, so the step reaches the network:
      # it carries its own deadline rather than the job's (issue 66). Measured p50 3.0, p90 3.1 minutes over twelve
      # pull request runs, so fifteen is a stall, not a slow day.
      - name: Boot the app, capture the proof and run the instrumented tests
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The action's defaults, plus the host video decoder off (issue 443): with it on the guest hands H.264 to the
          # emulator process, and the video controls test took the whole emulator down about one run in five.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          working-directory: android
          script: |
            bash scripts/boot-proof.sh
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/chat-light.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/chat-dark.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/about-light.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/about-dark.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/settings-light.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/settings-dark.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/update-ready-light.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/update-install-prompt-light.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/video-controls-portrait.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/video-controls-landscape.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/audio-playing.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/audio-voice.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/text-effects.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/load-order.json
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/edit-history.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/text-format.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/group-rename.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/send-effects.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/mention.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/bubble-colours-light.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/bubble-colours-dark.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/group-members.png
            test -s app/build/outputs/connected_android_test_additional_output/debugAndroidTest/connected/*/history-scroll.png

      # Issue 443 again: with the host decoder off the emulator still exits under VideoControlsTest about one run in
      # three, leaving no crash dump (the crash record holds only its settings), which a caught crash would have written.
      # A process killed from outside writes none, so the kernel's own log is read for a kill and the memory it saw.
      # Issue 443: the crash record is kept only when something failed. A green run has nothing to explain, and a
      # passing job should not carry a crash dump.
      - name: Say why the emulator went away
        if: failure()
        working-directory: .
        run: |
          {
            date -u +"crash record %Y-%m-%dT%H:%M:%SZ"
            free -m
            sudo dmesg -T | grep -iE 'killed process|out of memory|oom|qemu|segfault|emulator' | tail -40 || true
            ls -la /tmp/android-runner/ 2>/dev/null || true
            ls -la /tmp/android-runner/emu-crash-*.db 2>/dev/null || true
          } | tee android/crash.txt

      - name: Keep the crash record
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-crash-record
          path: |
            android/crash.txt
            /tmp/android-runner/emu-crash-*.db
          if-no-files-found: ignore

      - name: Keep the boot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot-proof
          path: |
            android/proof
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn

  # The publish half: the APK, signed with the Android release keystore.
  #
  # A pull request ships nothing, so this job does not run there; a push to main
  # or a manual run does, and it is the one path that needs the keystore. The
  # signing itself is android-release.yml, the same reusable leg release.yml
  # calls to build the APK it publishes in its own run (issue 525).
  release:
    name: sign and publish the APK
    needs: [build-and-boot]
    if: github.event_name != 'pull_request' && needs.build-and-boot.result == 'success'
    uses: ./.github/workflows/android-release.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CUATE_GOOGLE_SERVICES_JSON: ${{ secrets.CUATE_GOOGLE_SERVICES_JSON }}
