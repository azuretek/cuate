name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The platforms gate reads the other pipelines' runs and jobs, and a reusable
  # workflow can only be granted what its caller has. Nothing here writes.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A network step, so it has its own deadline rather than the job's (issue 66).
      - name: Install
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  # ★ The desktop on screen, on EVERY platform, with the scheme matrix included. A design, style or token change is
  # validated on each platform rather than only the one it was written on: a change that breaks one platform's chrome,
  # or only dark, fails a leg whose name says which platform and which scheme. The leg renders the app against a fake
  # server and asserts the tokens the page RESOLVES match core/spec/tokens.json in light and dark; a platform whose
  # chrome did not take the tokens names the token rather than passing as a boot. The same matrix of desktop legs runs
  # in package.yml against the packaged artifact, so the source tree and the shrink-wrapped build are both covered.
  desktop:
    name: desktop smoke (${{ matrix.os }})
    # Linux is pinned, not ubuntu-latest: the packages this leg installs come from the image, so the image's release
    # is part of what the run proves, not an accident of the day the job ran. macOS and Windows runners carry a
    # desktop session of their own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A network step, so it has its own deadline rather than the job's (issue 66).
      - name: Install
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      # The Electron download reaches the network, so it gets a cache and a deadline
      # like every other one: a cold or stalled download fails here in five minutes
      # rather than holding the job to its own limit.
      # The cache directory is named, not left to Electron's per-OS default: the
      # default is ~/.cache/electron only on Linux, so on macOS and Windows the
      # cached path never existed and nothing was ever saved (run 37005181037,
      # "Path Validation Error"). And the check below must not require('electron'):
      # Electron downloads itself on first require, so that check fetched the
      # binary with no deadline and then reported it as already unpacked.
      - name: Cache the Electron download
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - name: Ensure Electron is usable
        working-directory: desktop
        shell: bash
        timeout-minutes: 5
        env:
          ELECTRON_CACHE_HIT: ${{ steps.electron-cache.outputs.cache-hit }}
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          set -eo pipefail
          unpacked() { node -e "const fs=require('fs'),path=require('path'),d=path.dirname(require.resolve('electron/package.json'));let p;try{p=fs.readFileSync(path.join(d,'path.txt'),'utf8')}catch{process.exit(1)}if(!fs.existsSync(path.join(d,'dist',p)))process.exit(1)"; }
          case "${ELECTRON_CACHE_HIT}" in
            true) echo "electron download cache: hit" ;;
            false) echo "electron download cache: partial (restored from an older key)" ;;
            *) echo "electron download cache: miss" ;;
          esac
          zips=$(node -e "const fs=require('fs'),path=require('path'),r=process.env.electron_config_cache;let n=0;try{for(const d of fs.readdirSync(r))try{n+=fs.readdirSync(path.join(r,d)).filter((f)=>/^electron-v.*\.zip$/.test(f)).length}catch{}}catch{}console.log(n)")
          echo "electron archives in the cache: $zips"
          if unpacked; then
            echo "electron is already unpacked"
          else
            node node_modules/electron/install.js
          fi
          unpacked && node -e "require('electron')" && echo "electron loads"
      # Linux only: a virtual display, emoji fonts, the namespace restriction lifted so Chromium's sandbox starts, and
      # a session bus with an unlocked keyring so safeStorage encrypts the token as it does on a desktop. macOS and
      # Windows runners carry a desktop session, so the smoke opens a real window there.
      # The packages go through one bounded script: the unbounded apt-get here was the same shape that held the
      # packaging leg for forty-four minutes (run 36888349385) until the job's own timeout cancelled it.
      - name: A display and a keyring for Electron (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          set -eo pipefail
          bash scripts/ci/install-display-packages.sh xvfb dbus-x11 gnome-keyring libsecret-1-0 fonts-noto-color-emoji imagemagick
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "XDG_CURRENT_DESKTOP=GNOME" >> "$GITHUB_ENV"
          mkdir -p ~/.local/share/keyrings
          printf 'ci' | gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null
          printf 'ci' | gnome-keyring-daemon --start --components=secrets >/dev/null
          echo "SHOTS=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"
      # The virtual display has no GPU, so the app renders in software there; macOS and Windows render normally.
      - name: Boot the app against a server over the fake engine (Linux)
        if: runner.os == 'Linux'
        env:
          SMOKE_SOFTWARE_RENDERING: '1'
          SHOTS: ${{ runner.temp }}/shots
        run: xvfb-run -a -s "-screen 0 1280x800x24" node desktop/scripts/smoke.mjs
      - name: Boot the app against a server over the fake engine (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          SHOTS: ${{ runner.temp }}/shots
        run: node desktop/scripts/smoke.mjs
      # The window chrome's own proof (desktop/scripts/prove-window-chrome.mjs): the app drawn for each platform from
      # the one set of rules, measured for the side and the order the platform asks for and that nothing else is drawn
      # over the top. Headless, on every desktop platform, so a placement that only looks right on the one it was
      # written on fails a leg whose name says which platform. The captures go up as an artifact.
      - name: Prove the window chrome's placement (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: xvfb-run -a -s "-screen 0 1280x800x24" pnpm --filter desktop exec electron scripts/prove-window-chrome.mjs --shots "${{ runner.temp }}/proof-window-chrome"
      - name: Prove the window chrome's placement (macOS, Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 6
        run: pnpm --filter desktop exec electron scripts/prove-window-chrome.mjs --shots "${{ runner.temp }}/proof-window-chrome"
      # The tray's own proof (desktop/scripts/prove-tray.mjs, issue 115): the menu the icon carries, as Electron resolves
      # it, checked for its order; that menu captured as the platform draws it; and on macOS the template icon in the
      # light and the dark menu bar. The captures go up as an artifact for the pull request.
      - name: Prove the tray (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: xvfb-run -a -s "-screen 0 1280x800x24" pnpm --filter desktop exec electron scripts/prove-tray.mjs --shots "${{ runner.temp }}/proof-tray"
      - name: Prove the tray (macOS, Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 4
        run: pnpm --filter desktop exec electron scripts/prove-tray.mjs --shots "${{ runner.temp }}/proof-tray"
      - name: Keep the tray proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-proof-${{ matrix.os }}
          path: ${{ runner.temp }}/proof-tray
          if-no-files-found: warn
      - name: Keep the window chrome proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-chrome-proof-${{ matrix.os }}
          path: ${{ runner.temp }}/proof-window-chrome
          if-no-files-found: warn
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  packaging:
    name: desktop package verification
    needs: package-version
    uses: ./.github/workflows/package.yml
    with:
      signed: false
      version: ${{ needs.package-version.outputs.version }}
  # The server artifact a test release would carry, built, verified and booted from this commit, so a pull request
  # that breaks the server's packaging fails here rather than at publication.
  server:
    name: server artifact
    needs: package-version
    uses: ./.github/workflows/server-artifact.yml
    with:
      version: ${{ needs.package-version.outputs.version }}
  package-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        run: node scripts/release/version.mjs

  # ★ The platforms gate. A job cannot need a job in another workflow, so the
  # iOS leg is read through platforms-gate.yml, which requires that pipeline's
  # WHOLE job list. This is the one gate a pull request passes and the test build
  # passes, so a pull request that breaks any platform's leg fails it, and no
  # commit publishes from a run whose other platform was red. A pull request
  # exempts the TestFlight upload job, which cannot run there (it is skipped by
  # design and a skipped job is a refusal); a push to main requires it, so the
  # gate waits for the upload, for the build to reach VALID and for it to reach
  # the tester group.
  platforms:
    name: platforms gate
    uses: ./.github/workflows/platforms-gate.yml
    with:
      platforms: ios, android
      purpose: merge
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      ref_name: ${{ github.head_ref || github.ref_name }}
      exempt: ${{ github.event_name == 'pull_request' && 'release to TestFlight|sign and publish the APK' || '' }}
      window: 120

  gate:
    name: gate
    needs: [test, desktop, packaging, server, platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The gate fails only as a consequence of a leg it needs, so it names that leg: one red leg must not read as two
      # independent defects.
      - name: Every leg passed
        run: |
          failed=''
          for leg in "test=${{ needs.test.result }}" "desktop=${{ needs.desktop.result }}" "packaging=${{ needs.packaging.result }}" "server=${{ needs.server.result }}" "platforms=${{ needs.platforms.result }}"; do
            [ "${leg#*=}" = success ] || failed="$failed ${leg%%=*} (${leg#*=})"
          done
          if [ -n "$failed" ]; then
            echo "::error title=gate::the gate fails because a leg it needs did not pass:$failed. The cause is in that leg."
            exit 1
          fi
          echo 'every leg the gate needs passed: test, desktop, packaging, server, platforms'
