name: release-please

# ★ release-please owns the version, the tag and the changelog. One release pull
# request is kept open against main; merging it bumps every file that carries the
# version, writes CHANGELOG.md and tags vX.Y.Z. The test-build path (release.yml)
# is unchanged: it still publishes a snapshot per shipping push, and this workflow
# does not build or publish anything itself.
#
# The token: a pull request opened with the default GITHUB_TOKEN does not trigger
# other workflows, so the release pull request would never run the required gate.
# RELEASE_PLEASE_TOKEN must be a token allowed to open a pull request that runs
# CI; without it the action falls back to the default token and the release pull
# request will sit waiting for the gate.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
