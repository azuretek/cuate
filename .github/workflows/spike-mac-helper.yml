# Spike for issue #479 (Phase 0c). Lives only on its spike branch, which never merges.
# Tests the capability model, signs Cuate Helper.app with the Developer ID Application
# certificate, notarizes it with the App Store Connect API key, staples it and verifies it,
# then uploads the stapled bundle.
name: spike-mac-helper
on:
  push:
    branches: [spike/479-mac-helper]
permissions:
  contents: read
concurrency:
  group: spike-mac-helper
  cancel-in-progress: false
jobs:
  notarize:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HELPER: spike/mac-helper
      APP: spike/mac-helper/build/Cuate Helper.app
    steps:
      - uses: actions/checkout@v4

      - name: Test the capability model
        run: xcrun swift test --package-path "$HELPER"

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.CUATE_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CUATE_DEVID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::CUATE_DEVID_P12_BASE64 or CUATE_DEVID_P12_PASSWORD is not set."
            exit 1
          fi
          keychain="$RUNNER_TEMP/spike-signing.keychain-db"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$(security default-keychain -d user | tr -d '"')"
          hash="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$hash" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            exit 1
          fi
          echo "SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          VERSION: 0.0.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          COMMIT="${GITHUB_SHA::12}" "$HELPER/build.sh"

      - name: Notarize and staple
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          ( umask 077; printf '%s' "$ASC_KEY_P8" > "$key" )
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/submit.zip"
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          id="$(plutil -extract id raw "$RUNNER_TEMP/notary.json")"
          status="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          xcrun notarytool log "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization ended $status."
            exit 1
          fi
          xcrun stapler staple "$APP"

      - name: Verify
        run: |
          set -euo pipefail
          codesign --verify --strict --deep --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          codesign --display --requirements - "$APP"
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'NSContactsUsageDescription|NSAppleEventsUsageDescription|LSUIElement'
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Cuate-Helper.zip"
          shasum -a 256 "$RUNNER_TEMP/Cuate-Helper.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cuate-helper-${{ github.run_number }}
          path: ${{ runner.temp }}/Cuate-Helper.zip
          retention-days: 7
          if-no-files-found: error

      # The key and the keychain are removed whatever happened above.
      - name: Clean up the credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null || true
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
          fi
