name: experiment video flake

# Temporary: the video controls tests in a loop under candidate emulator settings, counting how often the emulator goes.
on: create

permissions:
  contents: read

jobs:
  loop:
    name: loop (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            gpu: swiftshader_indirect
            cores: 2
            ram: ''
          - variant: gpu-guest
            gpu: guest
            cores: 2
            ram: ''
          - variant: roomy
            gpu: swiftshader_indirect
            cores: 4
            ram: 4096M
          - variant: gpu-guest-roomy
            gpu: guest
            cores: 4
            ram: 4096M
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Loop
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          working-directory: android
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -feature -HardwareDecoder
          script: bash scripts/exp-video-loop.sh ${{ matrix.variant }}
      - name: Keep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp6-${{ matrix.variant }}
          path: android/exp
          if-no-files-found: warn
