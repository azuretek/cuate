name: experiment video flake

# Temporary: how long the CI emulator lives with nothing running on it, and what ends it.
on: create

permissions:
  contents: read

jobs:
  idle:
    name: idle (${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Idle
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: android
          script: bash scripts/exp-video-loop.sh idle
      - name: After
        if: always()
        run: |
          mkdir -p exp
          sudo dmesg -T | tail -60 | tee exp/dmesg.txt
          free -m | tee exp/free.txt
          ls -laR /tmp/android-runner 2>&1 | head -60 | tee exp/runner.txt
          cp -r /tmp/android-runner exp/android-runner 2>/dev/null || true
          ls -la ~/.android/avd/test.avd 2>&1 | tee exp/avd.txt
          cat ~/.android/avd/test.avd/config.ini 2>&1 | tee -a exp/avd.txt
      - name: Keep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp2-${{ matrix.replica }}
          path: android/exp
          if-no-files-found: warn
